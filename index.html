<!DOCTYPE html>
<html lang="ru">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takaiama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 14px;
            
            /* ИСПРАВЛЕНИЕ ЗДЕСЬ */
            overflow-x: hidden; /* Запрещаем только горизонтальную прокрутку */
            overflow-y: auto;   /* Разрешаем вертикальную прокрутку */
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: auto; 
            position: relative;
            z-index: 10; 
        }

        /* Фото профиля */
        .avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid #333;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 22px;
        }

        /* Обертка для боковых блоков и кнопок */
        .main-content {
            display: flex;
            gap: 16px;
            align-items: stretch;
            justify-content: center;
            margin-bottom: 22px;
        }

        /* Боковые блоки с пунктирной рамкой */
        .side-box {
            flex: 1;
            border: 2px dashed #555;
            border-radius: 11px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .side-box .arrow {
            font-size: 20px;
            margin-top: 5px;
            color: #aaa;
        }

        .links {
            flex: 1;
            max-width: 310px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        /* Кнопки */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            width: 100%;
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background-color: #111;
            border: 1px solid #222;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #1a1a1a;
            border-color: #444;
            transform: translateY(-1px);
        }

        .btn i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }
        
        .btn .btn-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* Цвета иконок */
        .btn .fa-telegram { color: #26A5E4; }
        .btn .fa-vk { color: #0077FF; }
        .btn .fa-youtube { color: #FF0000; }
        .btn .fa-tv { color: #fff; }
        .btn .fa-book { color: #F5A623; }
        .btn .fa-twitch { color: #9146FF; }
        .btn .fa-gamepad { color: #FF5500; }
        .btn .fa-steam { color: #66c0f4; }
        .btn .fa-instagram { color: #E4405F; }
        .btn .fa-discord { color: #5865F2; }
        .btn .fa-github { color: #fff; }
        .btn .fa-heart { color: #F5661F; }
        .btn .fa-book-open { color: #C1272D; }

        /* Секция с QR-кодом */
        .qr-section {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }

        .qr-section img {
            width: 130px;
            height: 130px;
            border-radius: 11px;
            background-color: #fff;
            padding: 8px;
            object-fit: contain;
        }

        footer {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
        }

        /* === СТИЛЬ ДЛЯ ПЛАВАЮЩЕЙ КНОПКИ === */
        .floating-btn {
            position: fixed;
            top: 0;
            left: 0;
            width: auto; 
            z-index: 9999;
            will-change: transform;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 0 1px #444; 
            background-color: #1a1a1a;
            border-color: #555;
        }

        .floating-btn:hover {
            background-color: #222;
            box-shadow: 0 4px 20px rgba(155, 89, 182, 0.6), 0 0 0 1px #9b59b6;
            border-color: #9b59b6;
            transform: translateY(-1px);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; align-items: center; }
            .side-box { width: 100%; max-width: 310px; padding: 12px; }
            .links { width: 100%; max-width: 310px; }
            .floating-btn { font-size: 13px; padding: 8px 12px; }
        }

        /* Для невысоких экранов */
        @media (max-height: 800px) {
            .avatar { width: 78px; height: 78px; margin-bottom: 10px; }
            h1 { font-size: 21px; }
            .subtitle { margin-bottom: 14px; }
            .btn { padding: 8px 13px; font-size: 13.5px; }
            .btn i { font-size: 16px; width: 20px; }
            .btn .btn-icon { width: 18px; height: 18px; }
            .links { gap: 6px; }
            .qr-section img { width: 100px; height: 100px; }
            .main-content { margin-bottom: 14px; }
            .side-box { padding: 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Скрипт случайного плавного движения по всему экрану -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btn = document.getElementById('floatingBtn');
            
            let posX = window.innerWidth / 2;
            let posY = window.innerHeight / 2;
            let velX = 0;
            let velY = 0;
            let targetX = posX;
            let targetY = posY;

            const maxSpeed = 2.5;      
            const acceleration = 0.03; 
            const friction = 0.98;     
            const targetRadius = 150;  

            function pickNewTarget() {
                const padding = 80; 
                targetX = padding + Math.random() * (window.innerWidth - padding * 2);
                targetY = padding + Math.random() * (window.innerHeight - padding * 2);
            }

            pickNewTarget(); 

            function animate() {
                let dx = targetX - posX;
                let dy = targetY - posY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < targetRadius) {
                    pickNewTarget();
                }

                if (distance > 0) {
                    velX += (dx / distance) * acceleration;
                    velY += (dy / distance) * acceleration;
                }

                velX *= friction;
                velY *= friction;

                const currentSpeed = Math.sqrt(velX * velX + velY * velY);
                if (currentSpeed > maxSpeed) {
                    velX = (velX / currentSpeed) * maxSpeed;
                    velY = (velY / currentSpeed) * maxSpeed;
                }

                posX += velX;
                posY += velY;

                btn.style.transform = `translate(${posX}px, ${posY}px)`;

                requestAnimationFrame(animate);
            }

            animate(); 

            window.addEventListener('resize', () => {
                pickNewTarget();
            });
        });
    </script>
