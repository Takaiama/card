<!DOCTYPE html>
<html lang="ru">
<head>   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takaiama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%; /* было height: 100% */
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* было center */
            min-height: 100vh;
            padding: 14px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: auto; /* добавлено — центрирует по вертикали, когда места хватает */
        }

        /* Фото профиля */
        .avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid #333;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 22px;
        }

        /* Обертка для боковых блоков и кнопок */
        .main-content {
            display: flex;
            gap: 16px;
            align-items: stretch;
            justify-content: center;
            margin-bottom: 22px;
        }

        /* Боковые блоки с пунктирной рамкой */
        .side-box {
            flex: 1;
            border: 2px dashed #555;
            border-radius: 11px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .side-box .arrow {
            font-size: 20px;
            margin-top: 5px;
            color: #aaa;
        }

        .links {
            flex: 1;
            max-width: 310px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        /* Кнопки */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            width: 100%;
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background-color: #111;
            border: 1px solid #222;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1a1a1a;
            border-color: #444;
            transform: translateY(-1px);
        }

        .btn i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }
        
        .btn .btn-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* Цвета иконок */
        .btn .fa-telegram { color: #26A5E4; }
        .btn .fa-vk { color: #0077FF; }
        .btn .fa-youtube { color: #FF0000; }
        .btn .fa-tv { color: #fff; }
        .btn .fa-book { color: #F5A623; }
        .btn .fa-twitch { color: #9146FF; }
        .btn .fa-gamepad { color: #FF5500; }
        .btn .fa-steam { color: #66c0f4; }
        .btn .fa-instagram { color: #E4405F; }
        .btn .fa-discord { color: #5865F2; }
        .btn .fa-github { color: #fff; }
        .btn .fa-heart { color: #F5661F; }
        
        .btn .fa-book-open { color: #C1272D; }

        /* Секция с QR-кодом */
        .qr-section {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }

        .qr-section img {
            width: 130px;
            height: 130px;
            border-radius: 11px;
            background-color: #fff;
            padding: 8px;
            object-fit: contain;
        }

        footer {
            margin-top: 12px;
            font-size: 11px;
            color: #444;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                align-items: center;
            }
            .side-box {
                width: 100%;
                max-width: 310px;
                padding: 12px;
            }
            .links {
                width: 100%;
                max-width: 310px;
            }
        }

        /* Для невысоких экранов */
        @media (max-height: 800px) {
            .avatar { width: 78px; height: 78px; margin-bottom: 10px; }
            h1 { font-size: 21px; }
            .subtitle { margin-bottom: 14px; }
            .btn { padding: 8px 13px; font-size: 13.5px; }
            .btn i { font-size: 16px; width: 20px; }
            .links { gap: 6px; }
            .qr-section img { width: 100px; height: 100px; }
            .main-content { margin-bottom: 14px; }
            .side-box { padding: 12px; font-size: 13px; }
        }

        /* Для очень невысоких экранов */
        @media (max-height: 700px) {
            .avatar { width: 64px; height: 64px; margin-bottom: 8px; }
            h1 { font-size: 18px; margin-bottom: 3px; }
            .subtitle { font-size: 11px; margin-bottom: 10px; }
            .btn { padding: 6px 11px; font-size: 12.5px; }
            .btn i { font-size: 14px; width: 18px; }
            .links { gap: 5px; }
            .qr-section img { width: 85px; height: 85px; }
            .main-content { margin-bottom: 10px; }
            footer { margin-top: 6px; }
        }
    </style>

    <!-- Основная иконка для браузера -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<!-- Иконка для iPhone / iPad (когда добавляют сайт на главный экран) -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<!-- Иконка для Android -->
<link rel="manifest" href="site.webmanifest">
    
</head>
<body>

            </div>

            <!-- Правый блок -->
            <div class="side-box">
                <span>А может и нет</span>
                <span class="arrow">&lt;-</span>
            </div>
        </div>

        <!-- QR-код внизу -->
        <div class="qr-section">
            <img src="qr.png" alt="QR-код">
        </div>

        <footer>
            Takaiama.ru
        </footer>
    </div>
</body>
</html>
